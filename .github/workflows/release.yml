name: Release

on:
  push:
    tags:
      - 'v*.*.*'   # trigger on tags like v1.0.0, v1.2.3

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bundle exec fastlane build_release

      - name: Get tag name
        id: tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Copy release artifacts
        run: |
          mkdir -p dist
          # Copy Universal APK
          if [ -f app/build/outputs/apk/release/app-universal-release.apk ]; then
            cp app/build/outputs/apk/release/app-universal-release.apk \
               dist/UniversalAntiSplit-${{ steps.tag.outputs.TAG }}-universal.apk
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk \
               dist/UniversalAntiSplit-${{ steps.tag.outputs.TAG }}.apk
          fi
          # Copy ABI split APKs if present
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "app/build/outputs/apk/release/app-${abi}-release.apk" ]; then
              cp "app/build/outputs/apk/release/app-${abi}-release.apk" \
                 "dist/UniversalAntiSplit-${{ steps.tag.outputs.TAG }}-${abi}.apk"
            fi
          done
          # Copy AAB
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab \
               dist/UniversalAntiSplit-${{ steps.tag.outputs.TAG }}.aab
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Universal Anti-Split ${{ steps.tag.outputs.TAG }}"
          body: |
            ## Universal Anti-Split ${{ steps.tag.outputs.TAG }}

            ### What's new
            - See commit history for changes

            ### Download
            - **Universal APK:** `UniversalAntiSplit-${{ steps.tag.outputs.TAG }}-universal.apk` (Supports all devices)
            - **ARM64 (64-bit):** `UniversalAntiSplit-${{ steps.tag.outputs.TAG }}-arm64-v8a.apk` (Recommended for modern phones)
            - **ARMv7 (32-bit):** `UniversalAntiSplit-${{ steps.tag.outputs.TAG }}-armeabi-v7a.apk` (Older phones)
            - **x86_64:** `UniversalAntiSplit-${{ steps.tag.outputs.TAG }}-x86_64.apk` (Emulators / Chromebooks)
            - **AAB:** `UniversalAntiSplit-${{ steps.tag.outputs.TAG }}.aab` (Android App Bundle)

            > ⚠️ If prompted, enable "Install from unknown sources" in Settings.
          files: dist/*
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.TAG, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
